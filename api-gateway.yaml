spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              # FIX: Resolves to http://order-service in k8s profile, and lb://ORDER-SERVICE locally with Eureka
              uri: ${ORDER_SERVICE_URI:lb://ORDER-SERVICE}
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - StripPrefix=2
                - name: LoggingOrdersFilter
                - name: Authentication
                  args:
                    isEnabled: true
                - name: Authorization
                  args:
                    allowedRoles: ADMIN,SUPER_ADMIN
                    isEnabled: true
            - id: inventory-service
              # FIX: Resolves to http://inventory-service in k8s profile, and lb://INVENTORY-SERVICE locally with Eureka
              uri: ${INVENTORY_SERVICE_URI:lb://INVENTORY-SERVICE}
              predicates:
                - Path=/api/v1/inventory/**
              filters:
                - StripPrefix=2
                - AddRequestHeader=X-Custom-Header, Aman
                - name: Authentication

server:
  port: 8080

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secretKey: a-string-secret-at-least-256-bits-long

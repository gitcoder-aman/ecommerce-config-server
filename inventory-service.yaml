spring:
  datasource:
    # FIX: Parameterize DB_PORT so local defaults to 5433 while K8s passes DB_PORT=5432 and DB_NAME=inventoryDB
    url: jdbc:postgresql://${DB_SERVICE:localhost}:${DB_PORT:5433}/${DB_NAME:inventory_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:3092}
    driver-class-name: org.postgresql.Driver

  # FIX: Uncommented JPA config so Hibernate creates tables before data.sql runs
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true

  # NOTE: 'always' re-inserts data.sql rows on every pod restart; switch to 'never' after initial seed if needed
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

server:
  port: 9010
  servlet:
    context-path: /inventory

# Used locally; overridden by application-k8s.yaml in K8s
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
